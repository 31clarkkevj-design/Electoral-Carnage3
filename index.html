<!DOCTYPE html> 
<html lang="en-us"> 
<head> 
    <meta charset="utf-8"> 
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"> 
    <title>Unity Web Player | Electoral Carnage</title> 
    <!-- This library will manually decompress the Brotli files inside GitHub Pages -->
    <script src="https://cloudflare.com"></script>
</head> 
<body style="text-align: center; padding: 0; border: 0; margin: 0;"> 
    <canvas id="unity-canvas" width="1280" height="720" tabindex="-1" style="width: 1280px; height: 720px; background: #231F20"></canvas> 
    
    <script src="Build/Robo Teddy Web.loader.js"></script> 
    <script> 
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) { 
            var meta = document.createElement('meta'); 
            meta.name = 'viewport'; 
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes'; 
            document.getElementsByTagName('head')[0].appendChild(meta); 
            
            var canvas = document.querySelector("#unity-canvas"); 
            canvas.style.width = "100%"; 
            canvas.style.height = "100%"; 
            canvas.style.position = "fixed"; 
            document.body.style.textAlign = "left"; 
        } 

        // interceptor hack to fetch and manually decompress files on GitHub Pages
        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
            const url = args[0];
            if (typeof url === 'string' && url.endsWith('.br')) {
                const response = await originalFetch(...args);
                const arrayBuffer = await response.arrayBuffer();
                const decompressed = BrotliDecode(new Uint8Array(arrayBuffer));
                return new Response(decompressed, {
                    headers: { 'Content-Type': url.endsWith('.wasm.br') ? 'application/wasm' : 'application/javascript' }
                });
            }
            return originalFetch(...args);
        };
        
        createUnityInstance(document.querySelector("#unity-canvas"), { 
            arguments: [], 
            dataUrl: "Build/Robo Teddy Web.data.br", 
            frameworkUrl: "Build/Robo Teddy Web.framework.js.br", 
            codeUrl: "Build/Robo Teddy Web.wasm.br", 
            streamingAssetsUrl: "StreamingAssets", 
            companyName: "BombSequiturGames", 
            productName: "Electoral Carnage", 
            productVersion: "1.0", 
        }).then((unityInstance) => { 
        }).catch((message) => { 
            alert(message); 
        }); 
    </script> 
</body> 
</html>
